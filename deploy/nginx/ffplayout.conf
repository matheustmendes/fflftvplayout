# nginx na frente do ffplayout e do relay, com HTTPS.
#
# - https://painel.exemplo.com.br     interface e API do ffplayout (usuário e senha do próprio ffplayout)
# - https://sinal.exemplo.com.br/canal1/index.m3u8   m3u8 para os destinos (usuário e senha do nginx)
#
# Os certificados vêm do certbot (ver deploy/README.md). RTMP (1935) e SRT (8890/UDP)
# não passam pelo nginx: o relay escuta direto nessas portas.

# --- Painel ---
server {
    listen 80;
    server_name painel.exemplo.com.br;

    # Renovação do certificado (certbot --webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # "ssl http2" funciona em qualquer versão do nginx (o "http2 on;" só existe a partir da 1.25.1).
    listen 443 ssl http2;
    server_name painel.exemplo.com.br;

    ssl_certificate     /etc/letsencrypt/live/painel.exemplo.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/painel.exemplo.com.br/privkey.pem;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Envio de comerciais e programas (MXF costuma ser grande).
    client_max_body_size 7000M;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 36000s;
        proxy_send_timeout 36000s;
        proxy_buffering off;
    }
}

# --- m3u8 para os destinos ---
server {
    listen 80;
    server_name sinal.exemplo.com.br;

    # Renovação do certificado (certbot --webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # "ssl http2" funciona em qualquer versão do nginx (o "http2 on;" só existe a partir da 1.25.1).
    listen 443 ssl http2;
    server_name sinal.exemplo.com.br;

    ssl_certificate     /etc/letsencrypt/live/sinal.exemplo.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sinal.exemplo.com.br/privkey.pem;

    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Criar o arquivo de senhas: htpasswd -c /etc/nginx/hls.htpasswd destino
    auth_basic           "Sinal";
    auth_basic_user_file /etc/nginx/hls.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        # O relay confia em 127.0.0.1 para leitura; a senha é a do nginx.
        proxy_set_header Authorization "";
        proxy_http_version 1.1;
        proxy_buffering off;

        # A lista m3u8 muda a cada segmento: nunca guardar em cache.
        add_header Cache-Control "no-store" always;
    }
}
